    - Белые Халаты (belhalat.news)
    - Благотворительный фонд "Страна для жизни"
    - Инициатива "Честные люди"
    - Газета Салідарнасць
    - REFORM.BY
    - Медиазона Беларусь
    - Onliner
    - Petitions.by
    - VoiceOfBelarus
    - Our House
    - Hrodna Life
    - ЭХО Новости
    - Беларусский расследовательский центр
    - Thinktanks
    - Наша візія
    - БАЖ
    - Газета СБ. Беларусь сегодня
    - Беларусское телевидение (СТВ/БТ)
    - charter97
    - Настоящее Время
    - EcoHome
    - Malanka Media
    - Телеканал Дождь
    - Ходорковский LIVE
    - Авторский проект Николая Халезина «Перетрем с Халезиным»
    - Авторский проект Александра Ивулина «ЧестнОК-LIVE»
