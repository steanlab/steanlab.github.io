name: Новая публикация
description: Добавить запись на страницу
title: '[Публикация] '
labels:
- new-publication
body:
- type: markdown
  attributes:
    value: Запись будет добавлена на страницу автоматически. Название — на языке оригинала, как в источнике.
- type: dropdown
  id: section
  attributes:
    label: Раздел
    options:
    - ➕ Новый раздел (название — в поле ниже)
    - Бумажные книги
    - KV.BY этап. Заметки в бумажную газету «Компьютерные вести»
    - Серия «Ленивчик из мобильного телефона»
    - Серия «Пособие цифровым книгопечатникам»
    - Серия «Слово о демосцене»
    - HABR-a-HABR этап
    - Серия «заметки фитохимика» + статьи про растения
    - Серия «опусы про его величество клей»
    - Серия «дозиметр для Серёжи»
    - 'Тематические статьи: Радиация'
    - Серия «о простых вещах — сложно»
    - 'Тематические статьи: пандемия коронавируса COVID-19/Дезинфекция/Эпидемиология/Вирусология'
    - 'Тематические статьи: Токсикология'
    - 'Тематические статьи: Химия'
    - 'Тематические статьи: Ультрафиолет/Озон/СИЗ'
    - 'Тематические статьи: Продовольственная безопасность'
    - 'Тематические статьи: Насекомые/Городская энтомология'
    - 'Тематические статьи: Радиолюбительство/Ремонт ПК/DIY'
    - 'Тематические статьи: Фотография/Электронные книги'
    - 'Тематические статьи: Публицистика'
  validations:
    required: true
- type: input
  id: title
  attributes:
    label: Название материала
  validations:
    required: true
- type: input
  id: url
  attributes:
    label: Адрес материала (URL)
    placeholder: https://
  validations:
    required: true
- type: dropdown
  id: mark
  attributes:
    label: Метка (как в текущем списке)
    description: Где опубликован текст; на странице метка стоит перед названием.
    options:
    - без метки
    - P — Patreon
    - M — Medium
    - PK — Pikabu
    - ST — Substack
    - TG — Telegram
    - RD — Reddit
    default: 0
- type: textarea
  id: links
  attributes:
    label: Дополнительные ссылки
    description: 'По одной на строку: ПОДПИСЬ=АДРЕС, например RU=https://… (необязательно)'
- type: dropdown
  id: wayback
  attributes:
    label: Сохранить в Wayback Machine
    options:
    - Да
    - Нет
    default: 0
- type: markdown
  attributes:
    value: '**Новый раздел** — только если сверху выбран пункт «Новый раздел».'
- type: input
  id: new_section
  attributes:
    label: Название нового раздела
    description: Только если выбран пункт «Новый раздел» (в этом поле — название заголовка).
- type: dropdown
  id: level
  attributes:
    label: Уровень нового раздела
    options:
    - основной (заголовок 1-го уровня)
    - подраздел (2-го уровня)
    default: 1
- type: dropdown
  id: after
  attributes:
    label: Вставить новый раздел после
    description: 'Только для нового раздела: он встанет сразу после выбранного.'
    options:
    - Бумажные книги
    - KV.BY этап. Заметки в бумажную газету «Компьютерные вести»
    - Серия «Ленивчик из мобильного телефона»
    - Серия «Пособие цифровым книгопечатникам»
    - Серия «Слово о демосцене»
    - HABR-a-HABR этап
    - Серия «заметки фитохимика» + статьи про растения
    - Серия «опусы про его величество клей»
    - Серия «дозиметр для Серёжи»
    - 'Тематические статьи: Радиация'
    - Серия «о простых вещах — сложно»
    - 'Тематические статьи: пандемия коронавируса COVID-19/Дезинфекция/Эпидемиология/Вирусология'
    - 'Тематические статьи: Токсикология'
    - 'Тематические статьи: Химия'
    - 'Тематические статьи: Ультрафиолет/Озон/СИЗ'
    - 'Тематические статьи: Продовольственная безопасность'
    - 'Тематические статьи: Насекомые/Городская энтомология'
    - 'Тематические статьи: Радиолюбительство/Ремонт ПК/DIY'
    - 'Тематические статьи: Фотография/Электронные книги'
    - 'Тематические статьи: Публицистика'
    default: 19
