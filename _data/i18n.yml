  proj_malina_text: Каталог всех видео Никиты Мелкозерова, созданный в его память, с путеводителем по гостям и их профессиям.
  proj_zs_title: «Загляне сонца», путеводитель
  proj_zs_text: Каталог малоизвестного просветительского канала «Загляне сонца» Никиты Мелкозерова с кнопкой, которая выбирает случайную серию.
  proj_rubric_title: "«Топология сингулярности», авторская рубрика"
  proj_rubric_text: "Авторская рубрика о науке, технологиях и будущем в программе «Раніца з Белсатам» на Белсате (в эфире называется «Рубрыка Бесараба»). Все выпуски на YouTube и Odysee находятся в архиве СМИ."
  proj_lab66_title: "LAB-66"
  proj_lab66_text: "Авторский проект научной коммуникации по химии, радиационной, химической и биологической безопасности и гражданской науке, основан в 2019 году и назван в честь лаборатории № 66 Института общей и неорганической химии НАН Беларуси."
  proj_scihack_title: "Белорусский научный хакатон (SciHackathon)"
  proj_scihack_text: "Пилотный хакатон, прошедший 2–3 июня 2017 года в Парке высоких технологий в Минске: учёные и IT-специалисты вместе решали научно-технические задачи. Участвовало более 300 человек. Я был одним из организаторов и научным куратором."
  proj_notes_title: "«Нататкі фітахіміка»"
  proj_notes_text: "Аудионаброски, записанные вместе с <a href='https://be.wikisource.org/wiki/%D0%90%D1%9E%D1%82%D0%B0%D1%80:%D0%AE%D1%81%D1%82%D1%8B%D0%BD%D0%B0_%D0%A1%D0%B0%D1%9E%D0%BA%D0%B0'>Юстыной Саўкай</a>, выходившие для детской программы «Дасціпныя. Нястомныя. Кемлівыя» на канале радио «Культура». Записи выпусков есть в Викитеке."
  proj_hw_heading: "Электроника и открытый код"
  proj_hame_title: "Мини-роутер Hame A15 (клон)"
  proj_hame_text: "Руководство по доведению клона популярного китайского мини-роутера Hame A15 до рабочего состояния. Опубликовано на Habr в 2018 году, представлено на Chaos Constructions 2019. Также собственное открытое ПО автора на базе OpenWRT для процессоров Ralink."
  proj_bthome_title: "BTHome Logger"
  proj_bthome_text: "Приложение для Android с открытым кодом: записывает данные Bluetooth-датчиков в формате BTHome. Принято в F-Droid, публикация ожидается."
  proj_elements_title: "Таблица Менделеева для Flipper Zero"
  proj_elements_text: "Приложение для Flipper Zero: компактный справочник по 119 элементам с физическими, квантовыми, геохимическими и биологическими данными. Лицензия MIT."
