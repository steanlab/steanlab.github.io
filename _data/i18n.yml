  proj_zs_title: «Загляне сонца», даведнік
  proj_zs_text: Каталог малавядомага асветніцкага канала «Загляне сонца» Мікіты Мелказёрава з кнопкай, якая выбірае выпадковую серыю.
  proj_rubric_title: "«Тапалогія сінгулярнасці», аўтарская рубрыка"
  proj_rubric_text: "Аўтарская рубрыка пра навуку, тэхналогіі і будучыню ў праграме «Раніца з Белсатам» на Белсаце (у эфіры называецца «Рубрыка Бесараба»). Усе выпускі, на YouTube і Odysee, — у архіве СМІ."
  proj_lab66_title: "LAB-66"
  proj_lab66_text: "Навуковапапулярны праект пра хімію, радыяцыйную, хімічную і біялагічную бяспеку і грамадзянскую навуку, заснаваны ў 2019 годзе і названы ў гонар лабараторыі № 66 Інстытута агульнай і неарганічнай хіміі НАН Беларусі."
  proj_scihack_title: "Беларускі навуковы хакатон (SciHackathon)"
  proj_scihack_text: "Пілотны хакатон, які прайшоў 2–3 чэрвеня 2017 года ў Парку высокіх тэхналогій у Мінску: навукоўцы і IT-спецыялісты разам вырашалі навукова-тэхнічныя задачы. Удзельнічала больш за 300 чалавек; я быў адным з арганізатараў і навуковым куратарам."
  proj_notes_title: "«Нататкі фітахіміка»"
  proj_notes_text: "Аўдыёнарысы, запісаныя разам з Юстынай Саўкай для дзіцячай праграмы «Дасціпныя. Нястомныя. Кемлівыя» на канале «Культура». Тэкст — у Вікікрыніцах."
