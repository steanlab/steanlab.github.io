  card1_title: Ядзерная, радыяцыйная і хімічная бяспека
  card1_text: БелАЭС, чарнобыльскія тэрыторыі, могільнікі радыеактыўных адходаў і пункты іх захавання, радыеактыўныя і небяспечныя рэчывы, сродкі абароны, ацэнка рызык.
  card2_title: Футуралогія і глабальныя рызыкі
  card2_text: Тэхналагічнае прагназаванне, тэхнаэтыка, канвергенцыя чалавека і тэхналогій, экзістэнцыяльныя рызыкі і тэхналогіі двайнога прызначэння.
  card3_title: Тэхналагічная аналітыка
  card3_text: "ШІ і аналіз даных, біясенсары і насімая электроніка, FoodTech: што новыя тэхналогіі даюць і якія рызыкі нясуць."
  card4_title: Калоідная хімія і навука пра паверхню
  card4_text: Адсорбцыя, порыстыя матэрыялы, фільтрацыя, каталізатары, нанаматэрыялы, супрамалекулярная хімія, зялёная хімія.
  card5_title: Экалогія і клімат
  card5_text: Ачыстка вады і паветра, устойлівыя забруджвальнікі, экстрэмальнае надвор’е, адаптацыя да змены клімату.
  card6_title: Навуковая камунікацыя
  card6_text: Навуковая журналістыка, STEM-адукацыя, адкрытая навука, палітыка на аснове доказаў.
