  hero_h1: Химия, ядерная безопасность и глобальные риски.
  hero_lead: Независимый учёный, химик-исследователь в области коллоидной химии и химии поверхности, автор 12 патентов. Постоянный эксперт Белсата, Радио Свобода и Deutsche Welle по ядерной безопасности, глобальным катастрофическим рискам и аналитике технологий. Живёт в Европейском союзе.
