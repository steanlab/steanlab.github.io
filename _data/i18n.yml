  proj_malina_title: malina.by, мемарыяльны каталог
  proj_malina_text: Каталог усіх відэа Мікіты Мелказёрава, створаны ў яго памяць, з даведнікам па гасцях і іх прафесіях.
  proj_zs_title: «Загляне сонца», даведнік
  proj_zs_text: Каталог малавядомага асветніцкага канала «Загляне сонца» Мікіты Мелказёрава з кнопкай, якая выбірае выпадковую серыю.
  proj_rubric_title: "«Тапалогія сінгулярнасці», аўтарская рубрыка"
  proj_rubric_text: "Аўтарская рубрыка пра навуку, тэхналогіі і будучыню ў праграме «Раніца з Белсатам» на Белсаце (у эфіры называецца «Рубрыка Бесараба»). Усе выпускі на YouTube і Odysee знаходзяцца ў архіве СМІ."
  proj_lab66_title: "LAB-66"
  proj_lab66_text: "Аўтарскі праект навуковай камунікацыі па хіміі, радыяцыйнай, хімічнай і біялагічнай бяспецы і грамадзянскай навуцы, заснаваны ў 2019 годзе і названы ў гонар лабараторыі № 66 Інстытута агульнай і неарганічнай хіміі НАН Беларусі."
  proj_scihack_title: "Беларускі навуковы хакатон (SciHackathon)"
  proj_scihack_text: "Пілотны хакатон, які прайшоў 2–3 чэрвеня 2017 года ў Парку высокіх тэхналогій у Мінску: навукоўцы і IT-спецыялісты разам вырашалі навукова-тэхнічныя задачы. Удзельнічала больш за 300 чалавек. Я быў адным з арганізатараў і навуковым куратарам."
  proj_notes_title: "«Нататкі фітахіміка»"
  proj_notes_text: "Аўдыёнарысы, запісаныя разам з <a href='https://be.wikisource.org/wiki/%D0%90%D1%9E%D1%82%D0%B0%D1%80:%D0%AE%D1%81%D1%82%D1%8B%D0%BD%D0%B0_%D0%A1%D0%B0%D1%9E%D0%BA%D0%B0'>Юстынай Саўкай</a>, якія выходзілі для дзіцячай праграмы «Дасціпныя. Нястомныя. Кемлівыя» на канале радыё «Культура». Запісы выпускаў ёсць у Вікікрыніцах."
  proj_hw_heading: "Электроніка і адкрыты код"
  proj_hame_title: "Міні-роўтар Hame A15 (клон)"
  proj_hame_text: "Кіраўніцтва па даводцы да працоўнага стану клона папулярнага кітайскага міні-роўтара Hame A15. Апублікавана на Habr у 2018 годзе, прадстаўлена на Chaos Constructions 2019. Таксама ўласнае адкрытае ПЗ аўтара на базе OpenWRT для працэсараў Ralink."
  proj_bthome_title: "BTHome Logger"
  proj_bthome_text: "Праграма для Android з адкрытым кодам: запісвае даныя Bluetooth-датчыкаў у фармаце BTHome. Прынята ў F-Droid, публікацыя чакаецца."
  proj_elements_title: "Табліца Мендзялеева для Flipper Zero"
  proj_elements_text: "Праграма для Flipper Zero: кампактны даведнік па 119 элементах з фізічнымі, квантавымі, геахімічнымі і біялагічнымі данымі. Ліцэнзія MIT."
  proj_elements_shot: "Стартавы экран праграмы «Перыядычная табліца» на дысплеі Flipper Zero"
  proj_beacon_title: "BLE-маяк для Flipper Zero"
  proj_beacon_text: "Праграма для Flipper Zero: ператварае прыладу ў наладжвальны маяк Bluetooth Low Energy з незашыфраванымі рэкламнымі пакетамі для праверкі сканераў і інтэграцый разумнага дома. Ліцэнзія MIT."
  proj_beacon_shot: "Стартавы экран праграмы BLE Beacon на дысплеі Flipper Zero"
  proj_b154_title: "badge154"
  proj_b154_text: "Вэб-інструмент для загрузкі слайдшоу па Bluetooth на электронныя цэньнікі Hanshow Nebular 154 (e-paper), а таксама адкрытая прашыўка для гэтых цэньнікаў на працэсарах Telink TLSR8258."
  proj_pin16_title: "pin16"
  proj_pin16_text: "Вэб-старонка для загрузкі слайдшоу па Bluetooth на электронныя цэньнікі Solum (e-paper), а таксама адкрытая прашыўка для гэтых цэньнікаў на працэсарах Silicon Labs EFR32BG22."
