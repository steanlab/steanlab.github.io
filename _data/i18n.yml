  hero_h1: Хімія, ядзерная бяспека і глабальныя рызыкі.
  hero_lead: Незалежны навуковец, хімік-даследчык у галіне калоіднай хіміі і хіміі паверхні, аўтар 12 патэнтаў. Пастаянны эксперт Белсата, Радыё Свабода і Deutsche Welle па ядзернай бяспецы, глабальных катастрофічных рызыках і аналітыцы тэхналогій. Жыве ў Еўрапейскім саюзе.
