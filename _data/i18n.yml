  proj_zs_title: «Загляне сонца», a viewing guide
  proj_zs_text: A catalogue of the lesser-known educational channel «Загляне сонца» by Mikita Melkazyorau, with a button that picks a random episode.
  proj_rubric_title: "«Topology of the Singularity», a column"
  proj_rubric_text: "An author’s column on science, technology and the future in the programme «Раніца з Белсатам» on Belsat (on air it is called «Рубрыка Бесараба»). All episodes, on YouTube and Odysee, are in the media archive."
  proj_lab66_title: "LAB-66"
  proj_lab66_text: "An author’s science communication project on chemistry, radiation, chemical and biological safety and citizen science, founded in 2019 and named after laboratory No. 66 of the Institute of General and Inorganic Chemistry of the National Academy of Sciences of Belarus."
  proj_scihack_title: "Belarusian Science Hackathon (SciHackathon)"
  proj_scihack_text: "A pilot hackathon held on 2–3 June 2017 at the High-Tech Park in Minsk, which brought scientists and IT specialists together to solve scientific and technical problems. More than 300 participants took part. I was one of the organizers and its scientific curator."
  proj_notes_title: "Нататкі фітахіміка (Phytochemist’s Notes)"
  proj_notes_text: "Audio sketches recorded with <a href='https://be.wikisource.org/wiki/%D0%90%D1%9E%D1%82%D0%B0%D1%80:%D0%AE%D1%81%D1%82%D1%8B%D0%BD%D0%B0_%D0%A1%D0%B0%D1%9E%D0%BA%D0%B0'>Юстына Саўка</a>, broadcast for the children’s programme «Дасціпныя. Нястомныя. Кемлівыя» on the «Культура» radio channel. Recordings of the episodes are on Wikisource."
  proj_hw_heading: "Hardware and open source"
  proj_hame_title: "Hame A15 clone mini-router"
  proj_hame_text: "A guide to bringing a clone of the popular Chinese Hame A15 mini-router up to a working state, published on Habr in 2018 and presented at Chaos Constructions 2019. Also the author’s own open software based on OpenWRT for Ralink processors."
  proj_bthome_title: "BTHome Logger"
  proj_bthome_text: "An open source Android app for logging data from Bluetooth Low Energy sensors that use the BTHome format. Accepted by F-Droid, publication pending."
  proj_elements_title: "Periodic table for Flipper Zero"
  proj_elements_text: "A Flipper Zero app: a compact reference to 119 elements with physical, quantum, geochemical and biological data. MIT license."
  proj_elements_shot: "Start screen of the Periodic table app on a Flipper Zero display"
  proj_beacon_title: "BLE Beacon for Flipper Zero"
  proj_beacon_text: "A Flipper Zero app that turns the device into a configurable Bluetooth Low Energy beacon with unencrypted advertisements, for testing scanners and smart-home integrations. MIT license."
  proj_beacon_shot: "Start screen of the BLE Beacon app on a Flipper Zero display"
  proj_b154_title: "badge154"
  proj_b154_text: "A web tool for uploading slideshows over Bluetooth to Hanshow Nebular 154 e-paper price tags, and open firmware for these tags on Telink TLSR8258 processors."
  proj_pin16_title: "pin16"
  proj_pin16_text: "A web page for uploading slideshows over Bluetooth to Solum e-paper price tags, and open firmware for these tags on Silicon Labs EFR32BG22 processors."
