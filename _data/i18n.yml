  card1_title: Ядерная, радиационная и химическая безопасность
  card1_text: БелАЭС, чернобыльские территории, могильники радиоактивных отходов и пункты захоронения, радиоактивные и опасные вещества, средства защиты, оценка рисков.
  card2_title: Футурология и глобальные риски
  card2_text: Технологическое прогнозирование, техноэтика, конвергенция человека и технологий, экзистенциальные риски и технологии двойного назначения.
  card3_title: Технологическая аналитика
  card3_text: "ИИ и анализ данных, биосенсоры и носимая электроника, FoodTech: что новые технологии дают и чем рискуют."
  card4_title: Коллоидная химия и наука о поверхности
  card4_text: Адсорбция, пористые материалы, фильтрация, катализаторы, наноматериалы, супрамолекулярная химия, зелёная химия.
  card5_title: Экология и климат
  card5_text: Очистка воды и воздуха, стойкие загрязнители, экстремальная погода, адаптация к изменению климата.
  card6_title: Научная коммуникация
  card6_text: Научная журналистика, STEM-образование, открытая наука, политика на основе доказательств.
