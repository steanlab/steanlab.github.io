  - text: Кстати вспомнил своего любимого автора из школьной юности. Роман Севко aka AppleRom (если меня не подводит память, именно он основал известный сайт rom.by). Его статьи про BIOS я читал взахлеб, а вырезки из газеты ламинировал…Уже потом, будучи студентом меня угораздило даже купить у легендарного автора материнскую плату (как сейчас помню, ABIT под S462), но это совсем другая история…
  - text: Потихоньку статьи в бумажных газетах, а потом и сами компьютерные бумажные газеты ушли в небытие, туда же отправились форумы, IRC, ICQ, а на смену им пришли медиа-порталы и Телеграм. О том, какой след я оставил там — читайте ниже.
  - text: 'UPD. Хотя само-самой первой моей статьей была статья в беларусскую аналитическую газету "Секретные исследования": [Тайна планеты Х](https://github.com/steanlab/steanlab.github.io/blob/main/images/SR_2000_11(31).jpg). Номер 11(31) за 2000 год, страница 9'
