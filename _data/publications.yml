- title: HABR-a-HABR этап
  level: 1
  entries:
  - text: 'Большая часть моих статей — опубликована именно на упомянутом портале, началось все именно с него. Поэтому по-умолчанию ссылка идет на статью на habr.com. Единственное что я себе позволил - это отметить статьи, которые набрали больше 100 голосов комьюнити, это показывает насколько хорошо принята статья. Для остальных ресурсов введена цветовая дифференциация, где: M → Медиум, PK → Пикабу, P → Патреон. В некоторых случаях в скобках я тоже указывают количество "апплодисментов".'
