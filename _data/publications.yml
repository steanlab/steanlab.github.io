- title: Бумажные книги
  level: 1
  entries:
  - text: 'Пока представлены только одной позицией, научной монографией из далекого 2014 года, посвященной особенностям регулирования пористой структуры адсорбентов и кактализаторов. В общих чертах вопросы, которые затрагиваются в книге описаны в {BE:WIKIPEDIA}:'
