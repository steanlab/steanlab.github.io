- title: KV.BY этап. Заметки в бумажную газету «Компьютерные вести»
  level: 1
  entries:
  - text: Не многие наверное помнят эту газету, может только те, чья юношеская пора прошлась на 90-е и нулевые годы. Для меня КВ стала окном в мир технологической журналистики. Именно благодаря КВ я выживал в голодные студенческие годы, покупая на гонорары от статей запасы крупы. Именно редактор КВ, Анатолий Ализар (@alizar), прочитав мой первый черновик, ответил «_донеси что ты хочешь сказать, а стилистику мы подправим, не переживай_» и тем самым дал мне шанс через over 10 лет написать свои статьи на хабре. Спасибо и низкий вам поклон, газета Компьютерные Вести и ее редакция («мои университеты»)!..
  - text: Поэтому первыми в списке — мои самые старые, но самые для меня важные статьи, написанные в годы студенчества. Некоторые из них не утратили актуальности до сих пор.
