{%- comment -%} Счётчик GoatCounter: без cookie и без баннера согласия. Включается, когда в _config.yml указан код сайта (goatcounter: steanlab). {%- endcomment -%}
{% if site.goatcounter and site.goatcounter != "" %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{% endif %}
